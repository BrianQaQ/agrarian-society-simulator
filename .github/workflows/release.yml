name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build source archive
        run: |
          zip -r "agrarian-society-simulator-v${{ steps.version.outputs.version }}.zip" . \
            -x '.git/*' '__pycache__/*' '*.pyc'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Agrarian Society Simulator v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: "agrarian-society-simulator-v${{ steps.version.outputs.version }}.zip"
          fail_on_unmatched_files: true
