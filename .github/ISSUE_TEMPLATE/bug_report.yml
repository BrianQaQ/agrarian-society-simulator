name: Bug report
description: Report a reproducible problem in the simulator
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or settings
      placeholder: "python3 main.py --years 400 --mode evolution --seed 7"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12"
    validations:
      required: true

