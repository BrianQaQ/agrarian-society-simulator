[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrarian-society-simulator"
version = "1.0.0"
description = "A bottom-up agent-based simulation of land, inheritance, survival strategies, and agrarian cycles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wilmerfranzenqaq-dot" }]
keywords = ["agent-based-model", "agrarian-society", "inheritance", "simulation", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
agrarian-sim = "main:launch"

[tool.setuptools]
py-modules = ["main", "simulation"]

